name: Feeds

on:
  schedule:
    # Every 15 minutes. GitHub cron is UTC. Faster than 5 minutes is not allowed.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: feeds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CJ feeds
        env:
          CJ_USER: ${{ secrets.CJ_USER }}
          CJ_PASS: ${{ secrets.CJ_PASS }}
        run: |
          set -euo pipefail
          mkdir -p feeds
          pull() {
            local id="$1" name="$2"
            echo "pull ${id}/${name}"
            curl -fL --retry 2 -u "$CJ_USER:$CJ_PASS" \
              -o "feeds/${name}.zip" \
              "http://datatransfer.cj.com/datatransfer/files/8059923/outgoing/productcatalog/${id}/${name}.txt.zip"
          }
          pull 320958 "Sizeer_lt-SizeerLT_google_all-shopping"
          pull 321395 "iQueens_fr-iQueensFR_google_all-shopping"
          pull 321395 "Footshop_ch-FootshopCH_google_all-shopping"

      - name: Download Oxygen and JD
        env:
          OXYGEN_HOST: ${{ secrets.OXYGEN_HOST }}
          OXYGEN_PORT: ${{ secrets.OXYGEN_PORT }}
          OXYGEN_USER: ${{ secrets.OXYGEN_USER }}
          OXYGEN_PASS: ${{ secrets.OXYGEN_PASS }}
        run: |
          set -euo pipefail
          mkdir -p feeds/oxygen feeds/jd
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          pull_feed() {
            remote="$1"
            dest="$2"
            i=1
            while [ "$i" -le 5 ]; do
              rm -f "$dest"
              if lftp -u "$OXYGEN_USER","$OXYGEN_PASS" -p "${OXYGEN_PORT:-22}" "sftp://$OXYGEN_HOST" -e "set sftp:auto-confirm yes; set net:timeout 40; set xfer:clobber yes; get \"$remote\" -o \"$dest\"; bye"; then
                if [ -s "$dest" ]; then
                  echo "ok $remote"
                  return 0
                fi
              fi
              echo "retry $i $remote"
              i=$((i + 1))
              sleep 8
            done
            echo "failed $remote"
            return 1
          }
          pull_feed "/45460_4746173_mp.txt.gz" feeds/oxygen/oxygen.txt.gz
          gzip -dc feeds/oxygen/oxygen.txt.gz > feeds/oxygen/oxygen.txt
          rm -f feeds/oxygen/oxygen.txt.gz
          pull_feed "/43953_4746173_mp.txt.gz" feeds/jd/jd.txt.gz

      - name: Build catalog
        run: python3 scripts/build_catalog.py

      - name: Upload catalog to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            export PATH="$HOME/.local/bin:$PATH"
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="sneakeaway-catalog"
          put() {
            local src="$1" key="$2"
            aws s3 cp "$src" "s3://${BUCKET}/${key}" \
              --endpoint-url "$EP" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=300"
          }
          python3 - << 'PY'
          import json, datetime
          from pathlib import Path
          path = Path("promos.json")
          if path.exists():
              today = datetime.date.today().isoformat()
              rows = json.loads(path.read_text())
              kept = [r for r in rows if not r.get("until") or r.get("until") >= today]
              path.write_text(json.dumps(kept, ensure_ascii=False, indent=2) + "\n")
              print("promos", len(kept))
          PY
          if [ -f products.json ]; then put products.json products.json; fi
          if [ -f products-lite.json ]; then put products-lite.json products-lite.json; fi
          put catalog/first.json first.json
          put catalog/meta.json meta.json
          put promos.json promos.json
          put sitemap.xml sitemap.xml
          aws s3 sync catalog/pages "s3://${BUCKET}/pages" --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 sync catalog/index "s3://${BUCKET}/index" --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 sync catalog/items "s3://${BUCKET}/items" --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 sync catalog/map "s3://${BUCKET}/map" --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 sync catalog/sitemaps "s3://${BUCKET}/sitemaps" --endpoint-url "$EP" --content-type "application/xml; charset=utf-8" --cache-control "public, max-age=300"

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            products.json
            products-lite.json
            catalog/first.json
            catalog/meta.json
          retention-days: 5

