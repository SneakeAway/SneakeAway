name: Feeds

on:
  schedule:
    # Four times a day. A full run can take over an hour, so 15 minutes only cancels itself.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: feeds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CJ feeds
        env:
          CJ_USER: ${{ secrets.CJ_USER }}
          CJ_PASS: ${{ secrets.CJ_PASS }}
        run: |
          set -euo pipefail
          mkdir -p feeds
          pull() {
            local id="$1" name="$2"
            echo "pull ${id}/${name}"
            curl -fL --retry 2 -u "$CJ_USER:$CJ_PASS" \
              -o "feeds/${name}.zip" \
              "http://datatransfer.cj.com/datatransfer/files/8059923/outgoing/productcatalog/${id}/${name}.txt.zip"
          }
          pull 320958 "Sizeer_lt-SizeerLT_google_all-shopping"
          pull 321395 "iQueens_fr-iQueensFR_google_all-shopping"
          pull 321395 "Footshop_ch-FootshopCH_google_all-shopping"

      - name: Download Oxygen and JD
        env:
          OXYGEN_HOST: ${{ secrets.OXYGEN_HOST }}
          OXYGEN_PORT: ${{ secrets.OXYGEN_PORT }}
          OXYGEN_USER: ${{ secrets.OXYGEN_USER }}
          OXYGEN_PASS: ${{ secrets.OXYGEN_PASS }}
        run: |
          set -euo pipefail
          mkdir -p feeds/oxygen feeds/jd
          python3 -m pip install --user paramiko
          python3 - << 'PY'
          import gzip, os, sys, time
          import paramiko
          host = os.environ["OXYGEN_HOST"]
          port = int(os.environ.get("OXYGEN_PORT") or "22")
          user = os.environ["OXYGEN_USER"]
          password = os.environ["OXYGEN_PASS"]
          jobs = [
              ("/45460_4746173_mp.txt.gz", "feeds/oxygen/oxygen.txt.gz", "feeds/oxygen/oxygen.txt"),
              ("/43953_4746173_mp.txt.gz", "feeds/jd/jd.txt.gz", None),
          ]
          def pull(remote, dest):
              last = "no attempt"
              for n in range(1, 5):
                  try:
                      if os.path.exists(dest):
                          os.remove(dest)
                      transport = paramiko.Transport((host, port))
                      transport.connect(username=user, password=password)
                      sftp = paramiko.SFTPClient.from_transport(transport)
                      with sftp.open(remote, "rb") as src, open(dest, "wb") as out:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk:
                                  break
                              out.write(chunk)
                      sftp.close()
                      transport.close()
                      with gzip.open(dest, "rb") as fh:
                          fh.read(64)
                      print(f"ok {remote} {os.path.getsize(dest)} bytes", flush=True)
                      return True
                  except Exception as exc:
                      last = f"{type(exc).__name__}: {exc}"
                      print(f"retry {n} {remote}: {last}", flush=True)
                      time.sleep(8)
              print(f"failed {remote}: {last}", flush=True)
              return False
          ok = True
          for remote, dest, plain in jobs:
              if not pull(remote, dest):
                  ok = False
                  continue
              if plain:
                  with gzip.open(dest, "rb") as src, open(plain, "wb") as out:
                      while True:
                          chunk = src.read(1024 * 1024)
                          if not chunk:
                              break
                          out.write(chunk)
                  os.remove(dest)
          sys.exit(0 if ok else 1)
          PY

      - name: Build catalog
        run: python3 scripts/build_catalog.py

      - name: Upload catalog to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            export PATH="$HOME/.local/bin:$PATH"
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="sneakeaway-catalog"
          put() {
            local src="$1" key="$2"
            aws s3 cp "$src" "s3://${BUCKET}/${key}" \
              --endpoint-url "$EP" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=300"
          }
          python3 - << 'PY'
          import json, datetime
          from pathlib import Path
          path = Path("promos.json")
          if path.exists():
              today = datetime.date.today().isoformat()
              rows = json.loads(path.read_text())
              kept = [r for r in rows if not r.get("until") or r.get("until") >= today]
              path.write_text(json.dumps(kept, ensure_ascii=False, indent=2) + "\n")
              print("promos", len(kept))
          PY
          if [ -f products.json ]; then put products.json products.json; fi
          if [ -f products-lite.json ]; then put products-lite.json products-lite.json; fi
          put catalog/first.json first.json
          put catalog/meta.json meta.json
          put promos.json promos.json
          put sitemap.xml sitemap.xml
          aws s3 sync catalog/pages "s3://${BUCKET}/pages" --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 sync catalog/index "s3://${BUCKET}/index" --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 sync catalog/items "s3://${BUCKET}/items" --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 sync catalog/map "s3://${BUCKET}/map" --endpoint-url "$EP" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 sync catalog/sitemaps "s3://${BUCKET}/sitemaps" --endpoint-url "$EP" --content-type "application/xml; charset=utf-8" --cache-control "public, max-age=300"

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            products.json
            products-lite.json
            catalog/first.json
            catalog/meta.json
          retention-days: 5

