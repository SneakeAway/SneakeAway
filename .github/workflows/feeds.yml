name: Feeds

on:
  schedule:
    # 06:30 Europe/Sofia. GitHub cron is UTC, so 03:30 UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CJ feeds
        env:
          CJ_USER: ${{ secrets.CJ_USER }}
          CJ_PASS: ${{ secrets.CJ_PASS }}
        run: |
          set -euo pipefail
          mkdir -p feeds
          pull() {
            local id="$1" name="$2"
            echo "pull ${id}/${name}"
            curl -fL --retry 2 -u "$CJ_USER:$CJ_PASS" \
              -o "feeds/${name}.zip" \
              "http://datatransfer.cj.com/datatransfer/files/8059923/outgoing/productcatalog/${id}/${name}.txt.zip"
          }
          pull 320958 "Sizeer_lt-SizeerLT_google_all-shopping"
          pull 321395 "iQueens_fr-iQueensFR_google_all-shopping"
          pull 321395 "Footshop_ch-FootshopCH_google_all-shopping"

      - name: Download Oxygen feed
        env:
          OXYGEN_HOST: ${{ secrets.OXYGEN_HOST }}
          OXYGEN_PORT: ${{ secrets.OXYGEN_PORT }}
          OXYGEN_USER: ${{ secrets.OXYGEN_USER }}
          OXYGEN_PASS: ${{ secrets.OXYGEN_PASS }}
          OXYGEN_PATH: ${{ secrets.OXYGEN_PATH }}
        run: |
          set -euo pipefail
          mkdir -p feeds/oxygen
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$OXYGEN_USER","$OXYGEN_PASS" -p "${OXYGEN_PORT:-22}" "sftp://$OXYGEN_HOST" -e "set sftp:auto-confirm yes; get \"$OXYGEN_PATH\" -o feeds/oxygen/oxygen.txt; bye"

      - name: Build catalog
        run: python3 scripts/build_catalog.py

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            products.json
            products-lite.json
            catalog/first.json
            catalog/meta.json
          retention-days: 5

      - name: Commit light catalog
        run: |
          git config user.name "sneakeaway-feeds"
          git config user.email "feeds@users.noreply.github.com"
          git add products-lite.json catalog/first.json catalog/meta.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Update light catalog"
          git push
